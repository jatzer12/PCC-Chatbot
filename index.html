<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polynesian Cultural Center HelpDesk Support</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<!-- Floating Chat Button -->
<button id="chatLauncher" class="chat-launcher" aria-label="Open chat">
  💬
</button>
  
<body>
  <!-- Header -->
  <header class="header">
    <div class="container header-content">
      <div class="logo">PCC</div>
      <div class="title">
        <h1>Polynesian Cultural Center</h1>
        <p>HelpDesk Support</p>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Welcome / Hero -->
    <section class="hero">
      <h2>Welcome to PCC HelpDesk Support</h2>
      <p>
        Use our virtual assistant to troubleshoot common issues. Click “Start Chat” to begin.
      </p>

      <div class="actions">
        <button class="btn primary" id="openChat">Start Chat</button>
        <button class="btn secondary" id="resetChat">Reset Chat</button>
      </div>
    </section>

    <!-- Chatbot Panel -->
    <section class="chat card" id="chatSection" aria-hidden="true">
      <div class="chat-header">
        <div class="chat-title">
          <strong>Virtual Assistant</strong>
          <span class="chat-subtitle">PCC HelpDesk Support</span>
        </div>
        <button class="btn tiny" id="closeChat" title="Close">Close</button>
      </div>

      <div class="chat-window" id="chatWindow" role="log" aria-live="polite"></div>

      <div class="chat-actions" id="chatActions"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-content">
      <p>© 2026 Polynesian Cultural Center HelpDesk Support</p>
      <p>Internal IT Support Tool</p>
    </div>
  </footer>

  <script src="chatbot.js"></script>
</body>
</html>
