<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PCC HelpDesk Support</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <div class="page-wrap">
    <header class="hero">
      <h1>Polynesian Cultural Center HelpDesk Support</h1>
      <p>Welcome! Use the chat assistant in the bottom-right to get help.</p>
    </header>
  </div>

  <!-- Chat Launcher -->
  <button class="chat-launcher" id="chatLauncher" aria-label="Open HelpDesk Chat">
    <span class="launcher-dot"></span>
    <span class="launcher-text">HelpDesk</span>
  </button>

  <!-- Chat Widget -->
  <section class="chat-widget" id="chatWidget" aria-label="PCC HelpDesk Chat">
    <header class="chat-header">
      <div class="chat-header-left">
        <div class="chat-logo">PCC</div>
        <div class="chat-title">
          <strong>PCC HelpDesk Assistant</strong>
          <small>IT Support • Quick Answers</small>
        </div>
      </div>

      <div class="chat-header-actions">
        <button class="icon-btn" id="chatMinimize" aria-label="Minimize">—</button>
        <button class="icon-btn" id="chatClose" aria-label="Close">✕</button>
      </div>
    </header>

    <main class="chat-body" id="chatBody">
      <div class="msg assistant">
        <div class="bubble">
          Aloha! I’m your PCC HelpDesk assistant. What are you having trouble with?
          <div class="quick-actions">
            <button data-q="Computer issue">Computer</button>
            <button data-q="Printer issue">Printer</button>
            <button data-q="WiFi / Internet issue">WiFi / Internet</button>
          </div>
        </div>
      </div>
    </main>

    <footer class="chat-footer">
      <form class="chat-form" id="chatForm">
        <input
          class="chat-input"
          id="chatInput"
          placeholder="Type your message…"
          autocomplete="off"
        />
        <button class="send-btn" type="submit">Send</button>
      </form>
    </footer>
  </section>

  <script src="./chatbot.js"></script>
</body>
</html>
