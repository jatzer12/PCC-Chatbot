<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PCC HelpDesk Support</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <div class="page-wrap">
    <header class="hero">
      <h1>Polynesian Cultural Center HelpDesk Support</h1>
      <p>Welcome! Use the chat assistant in the bottom-right to get help.</p>
    </header>
  </div>

  <!-- Chat Launcher -->
  <button class="chat-launcher" id="chatLauncher" aria-label="Open PCC Virtual Support">
    <span class="launcher-dot" aria-hidden="true"></span>
    <span class="launcher-text">Support</span>
  </button>

  <!-- Chat Widget -->
  <section class="chat-widget" id="chatWidget" aria-label="PCC Virtual Support Chat">
    <header class="chat-header">
      <div class="chat-header-left">
        <div class="chat-logo" aria-hidden="true">PCC</div>
        <div class="chat-title">
          <strong>PCC Virtual Support</strong>
          <small>PCC IT Support</small>
        </div>
      </div>

      <div class="chat-header-actions">
        <!-- ✅ New Chat / Refresh button -->
        <button class="icon-btn" id="chatNew" aria-label="New chat" title="New chat">↻</button>

        <button class="icon-btn" id="chatMinimize" aria-label="Minimize chat" title="Minimize">—</button>
        <button class="icon-btn" id="chatClose" aria-label="Close chat" title="Close">✕</button>
      </div>
    </header>

    <main class="chat-body" id="chatBody">
      <div class="msg assistant">
        <div class="bubble">
          Aloha, I'm virtual assistant of Polynesian Cultural Center. How can I help you?
          <div class="quick-actions">
            <button type="button" data-q="I need help with my computer.">Computer</button>
            <button type="button" data-q="I need help with a printer issue.">Printer</button>
            <button type="button" data-q="I need help with WiFi / Internet.">WiFi / Internet</button>
          </div>
        </div>
      </div>
    </main>

    <footer class="chat-footer">
      <form class="chat-form" id="chatForm" autocomplete="off">
        <input class="chat-input" id="chatInput" placeholder="Type your message…" autocomplete="off" />
        <button class="send-btn" type="submit">Send</button>
      </form>
    </footer>
  </section>

  <script src="./chatbot.js"></script>
</body>
</html>
